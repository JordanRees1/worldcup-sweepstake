name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write # push image to GHCR via the built-in GITHUB_TOKEN
  id-token: write # Azure OIDC login (deploy job only)

env:
  IMAGE: ghcr.io/jordanrees1/sweepstake

jobs:
  # Always runs — free on a personal account (public repo: unlimited minutes;
  # private: 2,000 free min/month). No external secrets required.
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Opt-in: only runs when repo variable DEPLOY_ENABLED == 'true' AND the Azure
  # OIDC secrets are configured. See docs/DEPLOYMENT.md → Part 4 → CI/CD.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    env:
      RG: rg-personal-n-jordan-rg-jordan-sandbox
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Roll both container apps to the new image
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            suffix="gh-${GITHUB_SHA::7}-$(date +%H%M%S)"
            for app in sweepstake-dev sweepstake-prod; do
              echo "Updating $app -> $suffix"
              az containerapp update -n "$app" -g "$RG" \
                --image "${IMAGE}:${GITHUB_SHA}" \
                --revision-suffix "$suffix"
            done
